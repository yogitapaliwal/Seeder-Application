sonar.projectKey=seeder-react-app
sonar.qualitygate.wait=true
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
# Mirrors jest.config.js's collectCoverageFrom exclusions - these files are
# excluded from Jest's own coverage report, so they'd otherwise show up here
# as 0%-covered code even though they were never meant to be unit-tested
# (stories, barrel re-exports, ambient types, and pages/App.tsx which need
# integration tests instead, out of scope for this suite).
sonar.coverage.exclusions=**/*.stories.tsx,**/*.stories.ts,**/*index.ts,**/*index.tsx,**/*.d.ts,src/pages/**,src/App.tsx,src/setupTests.ts,src/__mocks__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info