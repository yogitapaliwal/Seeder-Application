image: node:22

variables:
  SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
  GIT_DEPTH: '0'

stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report

cache:
  paths:
    - seeder/node_modules/

run_tests:
  stage: test

  script:
    - cd seeder
    - corepack enable
    - yarn install --immutable
    - yarn test:cov
    - echo "=== Coverage Directory ==="
    - ls -la coverage

  artifacts:
    when: always
    paths:
      - seeder/coverage/**
    expire_in: 1 day

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

sonarqube-check:
  image: node:22
  stage: sonarqube-check

  needs:
    - job: run_tests
      artifacts: true

  dependencies:
    - run_tests

  script:
    - echo "=== Root Directory ==="
    - pwd
    - ls -la

    - echo "=== Seeder Directory ==="
    - cd seeder
    - pwd
    - ls -la

    - echo "=== Coverage Directory ==="
    - ls -la coverage

    - echo "=== Coverage File ==="
    - cat coverage/lcov.info | head -20

    - npx sonarqube-scanner -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  allow_failure: true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report

  script:
    - curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=${SONAR_PROJECT_KEY}&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json

  allow_failure: true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json
